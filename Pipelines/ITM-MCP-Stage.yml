variables:
  - name: projectName
    value: 'ITM.MCP'

trigger:
  branches:
    include:
      - stage
  paths:
    exclude:
      - Pipelines/**

name: $(date:yyyyMMdd)$(rev:.r)
resources:
  repositories:
  - repository: self
    type: git
    ref: stage

stages:
- stage: Build
  jobs:
  - job: BuildJob
    displayName: BuildJob
    pool:
      vmImage: windows-latest
    steps:
    - checkout: self

    - task: NodeTool@0
      inputs:
        versionSpec: '22.x'
      displayName: 'Install Node.js'

    - script: |
        npm install
      displayName: 'NPM Install'

    - script: |
        npm test
      displayName: 'NPM Test'

    - script: |
        npm run build
      displayName: 'TypeScript Compile'

    - task: PowerShell@2
      displayName: Config
      inputs:
        targetType: 'inline'
        script: |
          Copy-Item -Path "$(Build.SourcesDirectory)\.env.stage" -Destination "$(Build.SourcesDirectory)\.env" -Force
        failOnStderr: true
        showWarnings: true

    - task: PowerShell@2
      displayName: ArchiveArtifact
      inputs:
        targetType: 'inline'
        script: |
          Compress-Archive -Path "$(Build.SourcesDirectory)\*" -DestinationPath $(Build.ArtifactStagingDirectory)/$(projectName).zip
        failOnStderr: true
        showWarnings: true

    - task: PublishBuildArtifacts@1
      displayName: Publish Artifact
      condition: succeededOrFailed()
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        TargetPath: '\\my\share\$(Build.DefinitionName)\$(Build.BuildNumber)'

- stage: 'Deploy_MCP'
  displayName: 'Deploy_MCP'
  dependsOn: 'Build'
  jobs:
  - deployment: Deploy_MCP
    displayName: 'Deploy_MCP'
    environment:
      name: 'ITM-Stage'
      resourceType: VirtualMachine
      tags: 'web, stage'
    variables:
      websiteName: 'MCP'
      websitePath: 'C:\inetpub\wwwroot\ITM.MCP'
      ecosystemPath: 'C:\inetpub\wwwroot\ecosystem.config.js'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: PowerShell@2
            displayName: 'BackupSite'
            inputs:
              targetType: 'inline'
              script: |
                $websitePath = "$(websitePath)"
                $backupFolderName = "$(websiteName)" + "_Backup"
                $backupPath = Join-Path (Split-Path $websitePath -Parent) "0Backups\$backupFolderName"
                if (-not (Test-Path -Path $backupPath -PathType Container)) {
                    New-Item -ItemType Directory -Path $backupPath
                }
                if (Test-Path -Path $websitePath) {
                    Copy-Item -Path $websitePath\* -Destination $backupPath -Recurse -Force
                    Write-Host "Backup completed successfully. Backup location: $backupPath"
                } else {
                    Write-Host "No existing site to backup (first deployment). Skipping."
                }
              failOnStderr: true
              showWarnings: true

          - task: PowerShell@2
            displayName: 'Extract'
            inputs:
              targetType: 'inline'
              script: |
                if (-not (Test-Path -Path "$(websitePath)")) {
                    New-Item -ItemType Directory -Path "$(websitePath)"
                }
                Expand-Archive -Path $(Pipeline.Workspace)\drop\$(projectName).zip -DestinationPath '$(websitePath)' -Force
              failOnStderr: true
              showWarnings: true

          - task: PowerShell@2
            displayName: 'Copy env files'
            inputs:
              targetType: 'inline'
              pwsh: true
              script: |
                $ErrorActionPreference = 'Stop'
                Set-Location "$(websitePath)"
                Copy-Item -Path "$(websitePath)\.env.stage" -Destination "$(websitePath)\.env" -Force
                if (-not (Test-Path -Path "$(websitePath)\.env.demo")) {
                  throw ".env.demo file not found after extraction"
                }
                Write-Host "Environment files configured: .env (from .env.stage) and .env.demo"
              failOnStderr: true
              showWarnings: true

          - task: PowerShell@2
            name: EnsureApp
            displayName: 'Ensure MCP in global ecosystem (fail-fast)'
            inputs:
              targetType: 'inline'
              pwsh: true
              script: |
                $ErrorActionPreference = 'Stop'
                Set-Location "$(websitePath)"
                node scripts\ensure-ecosystem-app.cjs "$(ecosystemPath)" MCPStage,MCPDemo
                if ($LASTEXITCODE -ne 0) {
                  throw "ensure-ecosystem-app.cjs failed with exit code $LASTEXITCODE"
                }
              failOnStderr: true
              showWarnings: true

          - task: PowerShell@2
            name: Pm2StopAll
            displayName: 'PM2 stop both MCP instances'
            inputs:
              targetType: 'inline'
              pwsh: true
              script: |
                pm2 stop MCPStage 2>$null
                if ($LASTEXITCODE -ne 0) { Write-Host "MCPStage not running or already stopped" }

                pm2 stop MCPDemo 2>$null
                if ($LASTEXITCODE -ne 0) { Write-Host "MCPDemo not running or already stopped" }

                pm2 delete MCPStage 2>$null
                if ($LASTEXITCODE -ne 0) { Write-Host "MCPStage not found in PM2" }

                pm2 delete MCPDemo 2>$null
                if ($LASTEXITCODE -ne 0) { Write-Host "MCPDemo not found in PM2" }

                $LASTEXITCODE = 0
                Write-Host "PM2 cleanup completed successfully"
                exit 0
              failOnStderr: false
              showWarnings: true

          - task: PowerShell@2
            name: Pm2StartBoth
            displayName: 'PM2 start both MCP instances + save'
            inputs:
              targetType: 'inline'
              pwsh: true
              script: |
                $ErrorActionPreference = 'Stop'

                pm2 start "$(ecosystemPath)" --only MCPStage --update-env
                if ($LASTEXITCODE -ne 0) {
                  throw "pm2 start MCPStage failed with exit code $LASTEXITCODE"
                }

                pm2 start "$(ecosystemPath)" --only MCPDemo --update-env
                if ($LASTEXITCODE -ne 0) {
                  throw "pm2 start MCPDemo failed with exit code $LASTEXITCODE"
                }

                pm2 save
              failOnStderr: true
              showWarnings: true
